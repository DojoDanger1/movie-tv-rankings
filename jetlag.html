<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Lag: The Game Ranking</title>
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="filters">
        <select id="typeFilter" hidden><option value="all"></option></select>
        <select id="sagaFilter">
            <option value="all">All Game Types</option>
            <option value="Chase">Chase</option>
            <option value="Claim">Claim</option>
            <option value="Race">Race</option>
        </select>
        <select id="phaseFilter" hidden><option value="all"></option></select>
        <select id="franchiseFilter">
            <option value="all">All Franchises</option>
            <option value="Tag Eur-It">Tag Eur-It</option>
            <option value="Hide + Seek">Hide + Seek</option>
        </select>
        <select id="yearFilter">
            <option value="all">All Years</option>
            <option value="2022">2022</option>
            <option value="2023">2023</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
        </select>
        <select id="universeFilter">
            <option value="all">All Continents</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="North America">North America</option>
            <option value="Oceania">Oceania</option>
        </select>
        <select id="mediumFilter" hidden><option value="all"></option></select>
        <select id="ratingFilter">
            <option value="all">All Ratings</option>
            <option value="brilliant">Brilliant</option>
            <option value="great">Great</option>
            <option value="best">Best</option>
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="book">Book</option>
            <option value="innacuracy">Innacuracy</option>
            <option value="mistake">Mistake</option>
            <option value="miss">Miss</option>
            <option value="blunder">Blunder</option>
        </select>
        <select id="orderingDropdown">
            <option value="ranking">Ranking Order</option>
            <option value="release">Release Order</option>
        </select>
        <a href="index.html">Other Rankings</a>
    </div>
    <div id="rankingContainer"></div>
    <div class="filters">
        <p id="avgRating">Average Rating: <img id="avgRatingImg" src="imgs/icons/brilliant.png"/> Count: 0</p>
    </div>
    <div id="episodeModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeModal">&times;</button>
            <h2 id="modalTitle"></h2>
            <table id="episodeTable"></table>
        </div>
    </div>
    <script src="entries/jetlag.js"></script>
    <script src="script.js"></script>
</body>
</body>
</html>
